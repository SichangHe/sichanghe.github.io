name: Build and deploy mdBook site
on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build with mdBook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: true
          fetch-depth: 0
      - uses: cargo-bins/cargo-binstall@main
      - name: Install mdBook and Lua
        run: |
          cargo binstall -y mdbook --version 0.5.4
          sudo apt-get update
          sudo apt-get install -y lua5.4 lua-dkjson
      - name: Install mdBook-KaTeX
        run: cargo install --git https://github.com/SichangHe/mdbook-katex --rev f623f031d705ec96e5f747b8c3a910ef1a32734b --locked
      - name: Install minify-html
        run: |
          curl -L https://github.com/wilsonzlin/minify-html/releases/download/v0.18.1/minhtml-0.18.1-x86_64-unknown-linux-gnu -o minhtml
          chmod +x minhtml
      - name: Build
        run: mdbook build
      - name: Copy AGENTS.md
        run: |
          AGENTS_DIR=/notes/automation_software/
          cp "src${AGENTS_DIR}AGENTS.md" "_site/html${AGENTS_DIR}"
      - name: Remove dummy CV for search indexing, making clicks fall through to the other repository's pages
        run: rm _site/html/curriculum_vitae/index.html
      - name: Minify HTML and CSS
        run: find _site/html -type f \( -name "*.html" -o -name "*.css" \) -print0 | xargs -0 ./minhtml
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site/html

  deploy:
    name: Deploy the site to GitHub Pages
    concurrency:
      group: github-pages
      cancel-in-progress: false
    needs: build
    if: github.event_name == 'push'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
